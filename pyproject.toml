[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-stealth-fetch"
version = "0.1.0"
description = "可验证浏览器指纹语义的异步 HTTP 客户端（统一响应/会话/策略契约，四引擎实测适配）"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Framework :: AsyncIO",
]
dependencies = []

[project.optional-dependencies]
curl_cffi = ["curl_cffi>=0.16,<0.17"]
chrome_fp = ["chrome-fp>=0.5,<0.6"]
wreq = ["wreq>=0.12,<0.13"]
httpcloak = ["httpcloak>=1.7,<1.8"]
# primp 2.0.1 实测阻塞（无法启用 impersonate、UA 泄漏 Go-http-client、无会话 Cookie/关闭），
# 不提供 extra；rnet 为 GPL-3.0，默认不接入。详见 docs/engines.md
dev = ["pytest>=8", "pytest-asyncio>=0.24", "curl_cffi>=0.16,<0.17",
       "chrome-fp>=0.5,<0.6", "wreq>=0.12,<0.13", "httpcloak>=1.7,<1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "UP009",   # 保留 coding 声明（团队习惯）
    "SIM105",  # contextlib.suppress 可读性见仁见智
    "RUF001",  # 中文全角标点在字符串里是刻意的
    "RUF002", "RUF003",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["build/", "dist/"]
