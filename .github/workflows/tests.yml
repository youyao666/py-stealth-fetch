name: tests

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装（含全部引擎 extra，验证依赖元数据可解析）
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          pip install ruff mypy
          ruff check src/ tests/ examples/
          mypy src/stealth_fetch/
      - name: 测试（离线：本地 HTTP 服务 + fake engine + fixture，不请求公开站点）
        run: pytest tests/ -q
      - name: 构建 wheel
        run: |
          pip install build
          python -m build --wheel -o dist/
      - name: 隔离安装冒烟（核心导入零第三方）
        run: |
          python -m venv /tmp/isolated
          /tmp/isolated/bin/pip install dist/*.whl
          /tmp/isolated/bin/python -c "import stealth_fetch; print(stealth_fetch.__version__)"
